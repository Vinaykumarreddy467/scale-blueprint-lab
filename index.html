<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scale Blueprint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Learn system design from zero to advanced with live simulations and real-world case studies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Course navigation"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <button class="search-btn" id="searchBtn">
        <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Search topics, case studies…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <div class="top-progress" id="topProgress" title="Your progress"></div>
      <button class="icon-btn" id="themeBtn" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
      </button>
    </header>
    <main class="page" id="page" tabindex="-1"></main>
  </div>
</div>
<div class="palette" id="palette" hidden>
  <div class="palette-box" role="dialog" aria-label="Search">
    <input id="paletteInput" type="text" placeholder="Search: cache, sharding, Uber, CAP…" autocomplete="off">
    <div class="palette-list" id="paletteList"></div>
  </div>
</div>
<script src="js/util.js"></script>
<script src="js/sims.js"></script>
<script src="js/topics.js"></script>
<script src="js/cases.js"></script>
<script src="js/tools.js"></script>
<script src="js/app.js"></script>
</body>
</html>
